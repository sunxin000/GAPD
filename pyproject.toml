[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gapd-kbqa"
version = "0.1.1"
description = "Gold-Action Policy Distillation for agentic reinforcement learning in KBQA"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
authors = [{name = "GAPD authors"}]
dependencies = []

[project.urls]
Repository = "https://github.com/sunxin000/GAPD"
Paper = "https://arxiv.org/abs/2605.29584"

[project.optional-dependencies]
train = [
  "torch>=2.8.0", "transformers>=4.57.0,<5", "accelerate>=1.0.0",
  "datasets>=2.0.0", "tokenizers>=0.19.0", "ray>=2.10.0", "vllm>=0.10.2",
  "hydra-core>=1.3.0", "omegaconf>=2.3.0", "tensordict>=0.10.0", "torchdata>=0.8.0",
  "pyodbc>=5.0.0", "aioodbc>=0.5.0", "SPARQLWrapper>=2.0.0",
  "pandas>=2.0.0", "pyarrow>=15.0.0", "numpy>=1.26.0", "scikit-learn>=1.3.0",
  "tqdm>=4.66.0", "pyyaml>=6.0.0", "pydantic>=2.0.0", "einops>=0.7.0",
  "sentencepiece>=0.2.0", "tiktoken>=0.7.0", "tensorboard>=2.15.0", "wandb>=0.16.0",
  "peft==0.10.0", "packaging", "requests", "aiohttp", "pillow", "psutil",
  "codetiming", "dill", "cloudpickle", "rich", "huggingface-hub"
]

[tool.setuptools]
include-package-data = true
py-modules = ["kbqa_custom_reward"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kbqa_r1*", "verl*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
verl = ["**/*.yaml", "**/*.yml", "version/version", "py.typed"]
scripts = ["**/*.sh"]
